repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      - id: golangci-lint
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-imports
        args:
          - -local
          - golang.org,github.com
  - repo: .
    rev: v0.1.0-pre.0
    hooks:
      - id: go-errchecknext
