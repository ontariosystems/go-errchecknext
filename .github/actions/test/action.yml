name: test
description: tests go-errchecknext
inputs:
  go-version:
    description: "the version of golang"
    default: '1.27'
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: '**/go.sum'
    - name: download test dependencies
      run: go mod download
      working-directory: internal/testdata
      shell: bash
    - name: test
      run: make test
      shell: bash
